title: When Does Direct Collateral-Risk Certification Improve Slice-Aware Intrusion Response?
short_title: Direct vs. False-Positive Certification of Intrusion Response
authors: '[Author names and affiliations to be supplied]'
date: Preprint, 2 November 2026
journal: IEEE Transactions on Network and Service Management (target)
abstract: 'Mitigating a flagged user equipment harms benign users when the detector errs, and in a sliced 5G user plane the harm depends on the slice and the action. We ask when certifying each slice''s
  action-induced service-level-agreement (SLA) violation risk directly, using counterfactual replay and Learn-then-Test risk control, admits more attack mitigation than certifying per-slice false-positive
  rates. We prove that for a work-conserving water-filling scheduler, traffic-removing actions cannot harm non-acted users, so false-positive certification already bounds collateral. Relocating actions,
  such as redirection to a scrubbing service, break this bound. In a fluid simulator with a detector under domain shift, certified methods kept every budget in all splits. In eight pre-registered independent
  replications, the improvement of direct over false-positive certification was not confirmed: the mean change in delivered attack fraction was {{confirm::C::primary_FS_minus_SliceFPR::mean@+.3f}}, with
  95% interval [{{confirm::C::primary_FS_minus_SliceFPR::t95::0@.3f}}, {{confirm::C::primary_FS_minus_SliceFPR::t95::1@+.3f}}]. With redirection, a post-hoc large-sample analysis showed
  the false-positive criterion accepting policies that exceed their budgets, although no finite-sample violations were observed; direct certification remained valid. The certificate should be chosen by action type.'
keywords: Network slicing, intrusion response, risk control, Learn-then-Test, service-level agreements, false-positive control, user plane
ack: Simulation, analysis and drafting were carried out with the assistance of an AI coding assistant (Claude Code). All numbers are produced by the released code; all references carry a recorded verification
  status.
